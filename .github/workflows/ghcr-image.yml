# Reusable workflow: build one container image from a Dockerfile and, when asked, push it to GHCR as
# ghcr.io/unternai/<image> (org convention: untern-org AGENTS.md, "Container images").
#
# Tags: the short commit SHA always; `dev` when the run is on refs/heads/dev; the version (`1.2.3` from tag
# `v1.2.3`) when the run is on a version tag. Labels: org.opencontainers.image.source (the caller repo's
# URL, which links the package to the repo, so it stays private like the repo), .revision, .created,
# .version and .title.
#
# Only GitHub-owned actions and the Docker CLI preinstalled on ubuntu-latest (BuildKit, buildx): the org
# repos allow GitHub-owned actions plus a short list, and docker/* actions are not on it.
#
# Caller (one job per image; grant packages: write on that job only, the called job cannot gain it):
#
#   jobs:
#     api-image:
#       permissions:
#         contents: read
#         packages: write
#       uses: unternai/.github/.github/workflows/ghcr-image.yml@<commit SHA>
#       with:
#         image: untern-unfold-api
#         context: "."
#         dockerfile: api/Dockerfile
#         push: ${{ github.event_name != 'pull_request' }}
#         # Optional: private uv/pnpm git dependencies, same GitHub App as reusable-python-ci.yml.
#         private-deps-app-client-id: ${{ vars.PRIVATE_DEPS_APP_CLIENT_ID }}
#       secrets:
#         PRIVATE_DEPS_APP_PRIVATE_KEY: ${{ secrets.PRIVATE_DEPS_APP_PRIVATE_KEY }}
#
# With private-deps-app-client-id set, the job mints a read-only installation token and hands it to the
# build as the BuildKit secret `private-deps-secret-id` (default `github_token`), read from an environment
# variable. The Dockerfile reads it with `RUN --mount=type=secret,id=github_token ...`; it never becomes a
# build arg, a file in the context, a layer or a label.
name: GHCR image

on:
  workflow_call:
    inputs:
      image:
        description: Image name without the registry, `untern-<product>-<component>` (pushed as ghcr.io/unternai/<image>).
        type: string
        required: true
      context:
        description: Build context, relative to the repository root.
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        type: string
        default: Dockerfile
      push:
        description: Push the image to GHCR. False builds only (pull requests).
        type: boolean
        default: false
      build-args:
        description: Optional build arguments, one KEY=value per line. Never a secret.
        type: string
        default: ""
      private-deps-app-client-id:
        description: >-
          Optional. Client ID of the org GitHub App that reads the private repositories the build fetches.
          Leave empty when the build needs no private repository.
        type: string
        default: ""
      private-deps-secret-id:
        description: BuildKit secret id under which the App token reaches the Dockerfile.
        type: string
        default: github_token
    secrets:
      PRIVATE_DEPS_APP_PRIVATE_KEY:
        description: Private key of that GitHub App. Only needed with private-deps-app-client-id.
        required: false
    outputs:
      image:
        description: Image reference without a tag (ghcr.io/unternai/<image>).
        value: ${{ jobs.image.outputs.image }}
      tags:
        description: Tags built (and pushed when push is true), one per line.
        value: ${{ jobs.image.outputs.tags }}
      digest:
        description: Pushed image digest (sha256:...); empty when push is false.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Tags and OCI labels
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image }}
          # On pull requests, tag and label the head commit, not GitHub's test merge commit.
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${IMAGE_NAME}" =~ ^untern-[a-z0-9]+(-[a-z0-9]+)+$ ]]; then
            echo "::error::image '${IMAGE_NAME}' must be untern-<product>-<component> (lowercase kebab-case)"
            exit 1
          fi
          image="ghcr.io/unternai/${IMAGE_NAME}"
          short="${REVISION:0:7}"
          version="${short}"
          tags=("${image}:${short}")
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            tags+=("${image}:dev")
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
            tags+=("${image}:${version}")
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${REVISION}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.title=${IMAGE_NAME}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint token for private dependencies
        id: app-token
        if: inputs.private-deps-app-client-id != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.private-deps-app-client-id }}
          private-key: ${{ secrets.PRIVATE_DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Log in to GHCR
        if: inputs.push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PUSH: ${{ inputs.push }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SECRET_ID: ${{ inputs.private-deps-secret-id }}
          PRIVATE_DEPS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          args=(--file "${DOCKERFILE}" --platform linux/amd64 --provenance=false)
          while IFS= read -r tag; do [ -n "${tag}" ] && args+=(--tag "${tag}"); done <<< "${TAGS}"
          while IFS= read -r label; do [ -n "${label}" ] && args+=(--label "${label}"); done <<< "${LABELS}"
          while IFS= read -r arg; do [ -n "${arg}" ] && args+=(--build-arg "${arg}"); done <<< "${BUILD_ARGS}"
          if [ -n "${PRIVATE_DEPS_TOKEN}" ]; then
            # BuildKit reads the value from this step's environment; nothing is written to disk.
            args+=(--secret "id=${SECRET_ID},env=PRIVATE_DEPS_TOKEN")
          fi
          if [ "${PUSH}" = "true" ]; then
            args+=(--push --metadata-file "${RUNNER_TEMP}/build-metadata.json")
          fi
          docker buildx build "${args[@]}" "${CONTEXT}"
          if [ "${PUSH}" = "true" ]; then
            digest="$(jq -r '."containerimage.digest" // empty' "${RUNNER_TEMP}/build-metadata.json")"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Summary
        if: always()
        env:
          PUSHED: ${{ inputs.push }}
          OUTCOME: ${{ steps.build.outcome }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            if [ "${OUTCOME}" != "success" ]; then echo "### Build ${OUTCOME}";
            elif [ "${PUSHED}" = "true" ]; then echo "### Pushed"; else echo "### Built (not pushed)"; fi
            echo
            echo '```'
            echo "${TAGS}"
            if [ -n "${DIGEST}" ]; then echo "digest ${DIGEST}"; fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
